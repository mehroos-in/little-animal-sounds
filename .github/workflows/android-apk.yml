name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'index.html'
      - 'credits.html'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Little-Animal-Sounds-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Little-Animal-Sounds-Tab-A11-Plus.apk
          gh release create android-v1.3.0 Little-Animal-Sounds-Tab-A11-Plus.apk --title "Little Animal Sounds 1.3 — 28 Animal & Bird Friends" --notes "28 animal and bird entries with two photograph choices each (56 photographs total), photo and sound credits, and existing sound/pronunciation behaviour. Android tablets require internet for the learning site and recordings."
